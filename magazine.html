<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magazine Editions | The Aura Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #FFFFFF; --bg-secondary: #FAF7F6; --maroon-primary: #4A0E17;
      --maroon-deep: #2A0409; --maroon-accent: #8E2B38; --maroon-border: rgba(74, 14, 23, 0.12);
      --text-main: #2A0409; --text-muted: #5C4649; --text-light: #8E787B; --border-light: rgba(74, 14, 23, 0.09);
      --font-serif: 'Cormorant Garamond', Georgia, serif; --font-sans: 'Plus Jakarta Sans', sans-serif;
      --shadow-sm: 0 4px 15px rgba(74, 14, 23, 0.05); --shadow-hover: 0 28px 60px rgba(42, 4, 9, 0.22);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--bg-primary); color: var(--maroon-primary); font-family: var(--font-sans); line-height: 1.65; }
    h1, h2, h3, h4 { font-family: var(--font-serif); color: var(--maroon-deep); }
    .container { max-width: 1360px; margin: 0 auto; padding: 0 2rem; }
    .header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); z-index: 1000; height: 84px; display: flex; align-items: center; }
    .header-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .logo { font-family: var(--font-serif); font-size: 1.85rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; color: var(--maroon-deep); text-decoration: none; }
    .nav-menu { display: flex; align-items: center; gap: 2rem; list-style: none; }
    .nav-link { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--maroon-primary); text-decoration: none; }
    .nav-link.active { color: var(--maroon-accent); }
    .mag-tabs-section { padding-top: 130px; padding-bottom: 2.5rem; text-align: center; }
    .pipe-options-bar { display: inline-flex; align-items: center; gap: 1.4rem; }
    .pipe-tab-btn { font-family: var(--font-serif); font-size: 1.5rem; text-transform: uppercase; background: none; border: none; cursor: pointer; color: var(--text-light); }
    .pipe-tab-btn.active { color: var(--maroon-deep); font-weight: 700; }
    .magazines-archive-wrap { padding-bottom: 7rem; }
    .mag-covers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2.5rem 2rem; }
    .mag-card-wrap { background: #FFFFFF; border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
    .mag-card-wrap:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
    .mag-cover-poster { width: 100%; aspect-ratio: 3 / 4; background: #121212; position: relative; cursor: pointer; overflow: hidden; }
    .mag-cover-poster img { width: 100%; height: 100%; object-fit: cover; }
    .mag-edition-pill { position: absolute; top: 1rem; left: 1rem; background: rgba(42, 4, 9, 0.88); color: #FFFFFF; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.35rem 0.75rem; border-radius: 2px; }
    .mag-content-area { padding: 1.5rem 1.4rem; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
    .mag-headline-title { font-family: var(--font-serif); font-size: 1.25rem; color: var(--maroon-deep); font-weight: 600; margin-bottom: 0.4rem; cursor: pointer; }
    .mag-leader-meta { font-size: 0.86rem; color: var(--text-muted); margin-bottom: 1.2rem; }
    .mag-interaction-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border-light); }
    .interact-btn { background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
    .interact-btn.liked { color: #D32F2F; }
    
    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(42, 4, 9, 0.65); backdrop-filter: blur(16px); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 1.5rem; opacity: 0; pointer-events: none; transition: 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-box { background: #FFFFFF; border-radius: 8px; max-width: 840px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; display: grid; grid-template-columns: 0.85fr 1.15fr; box-shadow: 0 20px 48px rgba(0,0,0,0.2); }
    .modal-close-btn { position: absolute; top: 1.2rem; right: 1.2rem; background: #FFFFFF; border: 1px solid var(--border-light); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
    .modal-image-col { background-size: cover; background-position: center top; min-height: 380px; }
    .modal-content-col { padding: 2.8rem 2.2rem; display: flex; flex-direction: column; justify-content: space-between; }
    .btn-maroon { display: inline-block; background: var(--maroon-primary); color: #FFFFFF; padding: 0.8rem 1.5rem; border-radius: 4px; text-align: center; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.1em; text-decoration: none; }
    .toast-msg { position: fixed; bottom: 2rem; right: 2rem; background: var(--maroon-deep); color: #FFFFFF; padding: 0.8rem 1.6rem; border-radius: 30px; font-size: 0.85rem; font-weight: 700; display: none; z-index: 9999999; }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-container">
      <a href="index.html" class="logo">The Aura Review</a>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="magazine.html" class="nav-link active">Magazine</a></li>
        <li><a href="leaders.html" class="nav-link">Leaders</a></li>
        <li><a href="companies.html" class="nav-link">Companies</a></li>
        <li><a href="news.html" class="nav-link">News</a></li>
        <li><a href="feedbacks.html" class="nav-link">Feedbacks</a></li>
        <li><a href="faq.html" class="nav-link">FAQ</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="mag-tabs-section">
      <div class="container">
        <div class="pipe-options-bar">
          <button class="pipe-tab-btn active" data-category="all">All Leaders</button>
          <span>|</span>
          <button class="pipe-tab-btn" data-category="women">Women Leaders</button>
          <span>|</span>
          <button class="pipe-tab-btn" data-category="men">Men Leaders</button>
        </div>
      </div>
    </section>

    <section class="magazines-archive-wrap">
      <div class="container">
        <div class="mag-covers-grid" id="magazinesContainer"></div>
      </div>
    </section>
  </main>

  <!-- DETAILS MODAL -->
  <div class="modal-overlay" id="magModal">
    <div class="modal-box">
      <button class="modal-close-btn" onclick="document.getElementById('magModal').classList.remove('active')"><i class="ri-close-line"></i></button>
      <div class="modal-image-col" id="modalImg"></div>
      <div class="modal-content-col">
        <div>
          <span style="font-size: 0.78rem; text-transform: uppercase; color: var(--maroon-accent); font-weight: 600;" id="modalCategory">Editorial Edition</span>
          <h2 style="font-size: 2rem; color: var(--maroon-deep); margin: 0.4rem 0;" id="modalTitle">Title</h2>
          <div style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1.2rem; font-weight: 500;" id="modalSubtitle">Subtitle</div>
          <!-- Clean HTML rendered safely -->
          <div style="font-size: 0.95rem; line-height: 1.7; color: var(--text-muted); margin-bottom: 1.6rem; max-height: 220px; overflow-y: auto;" id="modalBio">Bio</div>
        </div>
        <div style="margin-top: 2rem;">
          <a href="leaders read digital.html" class="btn-maroon" style="width: 100%;">Read Digital Issue <i class="ri-arrow-right-line"></i></a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-msg" id="toastMsg">Action confirmed</div>

  <script>
    let magazineDatabase = [];

    document.addEventListener('DOMContentLoaded', () => {
      const customMags = JSON.parse(localStorage.getItem('AURA_CUSTOM_MAGS') || '[]');
      magazineDatabase = customMags;

      renderMagazines('all');

      document.querySelectorAll('.pipe-tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.pipe-tab-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          renderMagazines(e.target.getAttribute('data-category'));
        });
      });
    });

    function renderMagazines(category) {
      const container = document.getElementById('magazinesContainer');
      const filtered = category === 'all' ? magazineDatabase : magazineDatabase.filter(m => m.category === category);

      if (!filtered.length) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding:3rem;">No custom magazines published yet. Use the Admin Panel to publish editions.</p>`;
        return;
      }

      container.innerHTML = filtered.map(mag => `
        <div class="mag-card-wrap">
          <div class="mag-cover-poster" onclick="openModal('${mag.id}')">
            <span class="mag-edition-pill">${mag.editionTag || mag.industry || 'Edition'}</span>
            <img src="${mag.coverImage}" alt="${mag.title}">
          </div>
          <div class="mag-content-area">
            <div>
              <h3 class="mag-headline-title" onclick="openModal('${mag.id}')">${mag.title}</h3>
              <div class="mag-leader-meta">Featured: <strong>${mag.featuredLeader || mag.title}</strong></div>
            </div>
            <div class="mag-interaction-bar">
              <button class="interact-btn"><i class="ri-heart-line"></i> <span>${mag.likes || 12}</span></button>
              <button class="interact-btn" onclick="openModal('${mag.id}')"><i class="ri-book-open-line"></i> Read</button>
              <button class="interact-btn"><i class="ri-eye-line"></i> <span>${mag.views || 45}</span></button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openModal(magId) {
      const mag = magazineDatabase.find(m => m.id === magId);
      if (!mag) return;

      document.getElementById('modalImg').style.backgroundImage = `url('${mag.coverImage}')`;
      document.getElementById('modalCategory').textContent = mag.editionTag || mag.industry;
      document.getElementById('modalTitle').textContent = mag.title;
      document.getElementById('modalSubtitle').textContent = `Featured: ${mag.featuredLeader}`;
      
      // Render clean HTML instead of text tags
      document.getElementById('modalBio').innerHTML = mag.articleHtml || mag.desc || "Explore complete interactive flipbook issue.";
      document.getElementById('magModal').classList.add('active');
    }
  </script>
</body>
</html>
